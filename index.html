<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expandable Search Box</title>

    <!-- Font Awesome Icons -->
    <script
      src="https://kit.fontawesome.com/62828df5c5.js"
      crossorigin="anonymous"
    ></script>
    
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="search-container">
      <input type="checkbox" id="search-toggle" class="search-toggle" aria-label="Toggle Search Box" />
      
      <div class="search-box">
        <input 
          type="search" 
          id="search-input" 
          name="q" 
          placeholder="Type here..." 
          aria-label="Search site content"
        />
        <label for="search-toggle" class="search-btn" aria-label="Open Search">
          <i class="fas fa-search" aria-hidden="true"></i>
        </label>
      </div>
    </div>
  </body>
</html>
